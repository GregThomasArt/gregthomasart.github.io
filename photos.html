<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photos</title>

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

.viewer {
  text-align: center;
  position: relative;
}

.viewer img {
  max-width: 90vw;
  max-height: 80vh;
  border-radius: 6px;
}

/* counter */
.counter {
  margin-top: 10px;
  color: #ccc;
  font-size: 14px;
}

/* arrows */
.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  color: rgba(255,255,255,0.6);
  cursor: pointer;
  user-select: none;
  padding: 10px;
}

.arrow:hover {
  color: white;
}

.arrow.left {
  left: -60px;
}

.arrow.right {
  right: -60px;
}
</style>
</head>

<body>

<div class="viewer">

  <div class="arrow left" id="prev">&#10094;</div>

  <img id="photo" src="" alt="photo">

  <div class="arrow right" id="next">&#10095;</div>

  <div class="counter" id="counter"></div>

</div>

<script>
let photos = [];
let index = 0;

const img = document.getElementById("photo");
const counter = document.getElementById("counter");

async function loadPhotos() {
  const res = await fetch("photos/index.json");
  const files = await res.json();

  // convert to full paths
  photos = files.map(f => "photos/" + f);

  showPhoto(0);
}

function showPhoto(i) {
  index = (i + photos.length) % photos.length;
  img.src = photos[index];

  counter.textContent = `Photo ${index + 1} of ${photos.length}`;
}

document.getElementById("next").onclick = () => showPhoto(index + 1);
document.getElementById("prev").onclick = () => showPhoto(index - 1);

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") showPhoto(index + 1);
  if (e.key === "ArrowLeft") showPhoto(index - 1);
});

loadPhotos();
</script>

</body>
</html>
