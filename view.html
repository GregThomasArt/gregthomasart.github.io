<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>View Image</title>

<style>
body {
    margin: 0;
    background-color: #f2f2f2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

img {
    max-width: 95vw;
    max-height: 95vh;
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<img id="art">

<script>
const params = new URLSearchParams(window.location.search);
const file = params.get("file");
document.getElementById("art").src = file;
</script>

</body>
</html>
